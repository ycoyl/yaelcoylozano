        <div class="project-detail-content">
            <p class="project-detail-label">Proyecto destacado</p>
            <h3>RECUBRIMIENTO BIODEGRADABLE PARA BANDEJAS DE CÁSCARA DE UCHUVA</h3>
            <p class="project-meta">Proyecto en equipo · Prototipo de recubrimiento · Ensayos de hidrofobicidad, térmicos y de tensión</p>

            <div class="project-header-gallery project-image-gallery" aria-label="Portada del proyecto">
                <figure class="project-figure">
                    <img src="images/Portadarecubrimiento.png" alt="Portada del proyecto de recubrimiento biodegradable">
                    <figcaption>Recubrimiento biodegradable aplicado sobre una bandeja de cáscara de uchuva.</figcaption>
                </figure>
            </div>

            <h4>Resumen</h4>
            <p>Proyecto en equipo en el que desarrollamos y caracterizamos un recubrimiento biodegradable para bandejas fabricadas con cáscara de uchuva. Formulamos una película de gelatina, glicerol y cera de carnaúba y medimos su hidrofobicidad (ángulo de contacto, norma ISO 15989), su comportamiento térmico hasta 100 °C y sus propiedades en tensión (norma ASTM D882-18). La película alcanzó un ángulo de contacto de 93,2° y un esfuerzo máximo de 36,1 MPa con 14,3 % de alargamiento. Sobre la bandeja, el efecto fue hidrofóbico pero irregular, y de ahí salieron las recomendaciones para mejorar la aplicación.</p>

            <h4>Objetivo y contexto</h4>
            <p>Nuestro objetivo fue desarrollar un recubrimiento biodegradable que sirviera de barrera contra la humedad para una bandeja a base de cáscara de uchuva, un material rugoso y poroso. Buscamos una película que repeliera el agua, resistiera el contacto con productos calientes y fuera flexible, y la caracterizamos con tres ensayos: hidrofobicidad, comportamiento térmico y tensión.</p>

            <h4>Formulación y proceso</h4>
            <p>La película se compone de:</p>
            <ul>
                <li><strong>3 % de cera de carnaúba:</strong> aporta la hidrofobicidad.</li>
                <li><strong>8 % de gelatina:</strong> forma la matriz estructural.</li>
                <li><strong>3 % de glicerol:</strong> actúa como plastificante.</li>
                <li><strong>86 % de agua destilada.</strong></li>
            </ul>
            <p>El proceso consistió en preparar una emulsión a 70–80 °C, aplicarla por aspersión, inmersión o rodillo, y secarla a temperatura ambiente.</p>

            <h4>Análisis de hidrofobicidad</h4>
            <p>Evaluamos la hidrofobicidad con un ensayo de ángulo de contacto por gota estática con agua, siguiendo la norma ISO 15989. Para cada muestra tomamos cuatro fotografías, registramos los ángulos izquierdo y derecho y calculamos el promedio con el software OpenDrop.</p>

            <div class="project-fea-gallery project-image-gallery" aria-label="Comparación de hidrofobicidad sin y con recubrimiento">
                <figure class="project-figure">
                    <img src="images/Sin recubrimiento.JPG" alt="Bandeja sin recubrimiento">
                    <figcaption>Bandeja sin recubrimiento.</figcaption>
                </figure>
                <figure class="project-figure">
                    <img src="images/Con recubrimiento.JPG" alt="Bandeja con recubrimiento biodegradable">
                    <figcaption>Bandeja con recubrimiento biodegradable.</figcaption>
                </figure>
            </div>

            <div class="project-table-wrap">
                <table class="project-data-table">
                    <thead><tr><th>Superficie</th><th>Ángulos promedio por muestra</th><th>Promedio total</th></tr></thead>
                    <tbody>
                        <tr><td>Película plana</td><td>92,2° a 95,2°</td><td>93,2°</td></tr>
                        <tr><td>Bandeja recubierta</td><td>72,7° a 102°</td><td>90,0°</td></tr>
                    </tbody>
                </table>
            </div>

            <p><strong>Película plana:</strong> todos los valores superan los 90°, el umbral de una superficie hidrofóbica, con muy poca variación entre mediciones. Esto indica una superficie homogénea y continua, y refleja el efecto de la cera de carnaúba, que según la literatura aumenta la hidrofobicidad de las matrices de gelatina y reduce la permeabilidad al vapor de agua.</p>
            <p><strong>Bandeja recubierta:</strong> los ángulos son más dispersos. Algunas mediciones bajan hasta cerca de 70°, lo que indica zonas hidrofílicas, y otras superan los 100°. Atribuimos esa variabilidad a la rugosidad, la porosidad y la irregularidad de la bandeja, que dificultan una cobertura uniforme. Los valores altos pueden deberse a zonas donde el recubrimiento se acumuló y sí repelió el agua.</p>
            <p>El recubrimiento confiere cierta hidrofobicidad a la bandeja, aunque de forma no uniforme. Con una aplicación que deje una superficie más plana, el rendimiento podría mejorar.</p>

            <h4>Análisis térmico</h4>
            <p>Tras secarse a temperatura ambiente, el recubrimiento mostró buena adherencia y flexibilidad. En pruebas térmicas preliminares resistió hasta 100 °C sin deterioro ni separación del sustrato. El único cambio fue un leve endurecimiento, que interpretamos como una transición estructural.</p>
            <p>Ese comportamiento es coherente con las propiedades de sus componentes:</p>
            <ul>
                <li><strong>Cera de carnaúba:</strong> tiene un punto de fusión alto (80–86 °C), es insoluble en agua y está aprobada como aditivo alimentario.</li>
                <li><strong>Gelatina:</strong> es una proteína que empieza a desnaturalizarse por encima de 40 °C. En nuestras pruebas eso no causó pérdida de funcionalidad, y el endurecimiento observado a 100 °C podría ser consecuencia de ese cambio estructural.</li>
                <li><strong>Glicerol:</strong> es el plastificante que evita la fragilidad, aunque puede empezar a evaporarse lentamente cerca de 100 °C y también podría contribuir al endurecimiento.</li>
            </ul>
            <p>Así, el recubrimiento mantiene la integridad mecánica frente a productos calientes, sin fisuras ni deformaciones visibles.</p>

            <h4>Análisis de tensión</h4>
            <div class="project-single-image project-image-gallery" aria-label="Ensayo de tensión">
                <figure class="project-figure">
                    <img src="images/Ensayo tensión.jpg" alt="Ensayo de tensión del recubrimiento">
                    <figcaption>Ensayo de tensión realizado sobre las probetas del recubrimiento.</figcaption>
                </figure>
            </div>
            <p>Ensayamos probetas de 7 cm de largo, 1 cm de ancho y 0,5 mm de espesor (área transversal de 5 mm²), con dimensiones según la norma ASTM D882-18 para películas plásticas delgadas. Calculamos el esfuerzo como σ = F/A y el alargamiento como (ΔL/L₀) × 100.</p>

            <div class="project-table-wrap">
                <table class="project-data-table">
                    <thead><tr><th>Muestra</th><th>Carga máx. (kN)</th><th>Esfuerzo (MPa)</th><th>Alargamiento (%)</th><th>Observación</th></tr></thead>
                    <tbody>
                        <tr><td>1</td><td>0,1078</td><td>21,56</td><td>2,38</td><td>Preliminar</td></tr>
                        <tr><td>2</td><td>0,0938</td><td>18,75</td><td>3,76</td><td>Preliminar</td></tr>
                        <tr><td>3</td><td>0,1703</td><td>34,06</td><td>12,58</td><td>Confiable</td></tr>
                        <tr><td>4</td><td>0,1906</td><td>38,13</td><td>16,05</td><td>Confiable</td></tr>
                        <tr><td><strong>Media (3 y 4)</strong></td><td><strong>0,1805</strong></td><td><strong>36,10</strong></td><td><strong>14,32</strong></td><td></td></tr>
                    </tbody>
                </table>
            </div>

            <p>Las dos primeras muestras fueron pruebas preliminares con posibles irregularidades, así que tomamos las muestras 3 y 4 como las más representativas.</p>
            <ul>
                <li><strong>Muestras 1 y 2:</strong> curva de pendiente pronunciada, con una zona elástica corta y rotura frágil.</li>
                <li><strong>Muestras 3 y 4:</strong> zona plástica extendida, típica de un material con plastificante.</li>
            </ul>
            <p>El esfuerzo máximo de 36,1 MPa queda cerca del rango del PLA (aproximadamente 40–60 MPa) y por debajo del PET (aproximadamente 80 MPa). Los alargamientos superiores al 12 % indican alta ductilidad, atribuible al glicerol.</p>

            <h4>Relación composición–estructura–propiedades</h4>
            <ul>
                <li>La gelatina (8 %) aporta resistencia, pero necesita el glicerol (3 %) para evitar la fragilidad.</li>
                <li>La cera (3 %) mejora la hidrofobicidad, pero pudo reducir la adherencia intermolecular en zonas mal emulsionadas, lo que afectaría a las muestras 1 y 2.</li>
                <li>El secado a temperatura ambiente pudo generar tensiones residuales, lo que explicaría la dispersión de los datos preliminares.</li>
            </ul>

            <h4>Conclusiones</h4>
            <ul>
                <li>La formulación de cera de carnaúba, gelatina y glicerol tiene un comportamiento mecánico adecuado para empaques biodegradables flexibles: 36,1 MPa de esfuerzo máximo y 14,3 % de alargamiento en las muestras confiables.</li>
                <li>La gelatina como matriz y el glicerol como plastificante logran un equilibrio entre resistencia y ductilidad.</li>
                <li>El recubrimiento tiene un comportamiento térmico favorable, con adherencia al sustrato incluso a 100 °C.</li>
                <li>La película es hidrofóbica (93,2°, por encima del umbral de 90°), y la cera de carnaúba demostró ser una estrategia eficaz para mejorar la resistencia al agua.</li>
                <li>Sobre la bandeja, el efecto es no uniforme (70° a 102°) por la rugosidad y porosidad del sustrato. Los valores superiores a 100° muestran que puede ser muy eficaz si se logra una aplicación homogénea.</li>
                <li>Los resultados respaldan su potencial como barrera contra la humedad, sobre todo en aplicaciones de corta duración, como bandejas para domicilios o eventos.</li>
            </ul>

            <h4>Trabajo futuro</h4>
            <ul>
                <li>Optimizar la técnica de aplicación, controlando la viscosidad o usando moldes para lograr una cobertura homogénea sobre la bandeja.</li>
                <li>Mejorar la emulsificación y controlar las condiciones de secado, para reducir la dispersión de los datos mecánicos.</li>
                <li>Repetir el ensayo de tensión con más probetas, para confirmar las propiedades y no depender de dos muestras.</li>
                <li>Ampliar los ensayos térmicos más allá de las pruebas preliminares.</li>
            </ul>

            <h4>Herramientas y normas</h4>
            <p>ISO 15989 (ángulo de contacto) · ASTM D882-18 (tensión de películas delgadas) · OpenDrop · Ensayo de tensión · Análisis térmico</p>
