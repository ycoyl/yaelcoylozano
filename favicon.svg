<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo -->
  <rect width="100" height="100" fill="#0b1121"/>
  
  <!-- Engrane principal -->
  <g transform="translate(50, 50)">
    <!-- Círculo central -->
    <circle cx="0" cy="0" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Dientes del engrane (12 dientes) -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <!-- Diente 1 (arriba) -->
      <line x1="0" y1="-35" x2="0" y2="-42"/>
      <!-- Diente 2 -->
      <line x1="18" y1="-30" x2="23" y2="-36"/>
      <!-- Diente 3 -->
      <line x1="30" y1="-18" x2="36" y2="-23"/>
      <!-- Diente 4 -->
      <line x1="35" y1="0" x2="42" y2="0"/>
      <!-- Diente 5 -->
      <line x1="30" y1="18" x2="36" y2="23"/>
      <!-- Diente 6 -->
      <line x1="18" y1="30" x2="23" y2="36"/>
      <!-- Diente 7 (abajo) -->
      <line x1="0" y1="35" x2="0" y2="42"/>
      <!-- Diente 8 -->
      <line x1="-18" y1="30" x2="-23" y2="36"/>
      <!-- Diente 9 -->
      <line x1="-30" y1="18" x2="-36" y2="23"/>
      <!-- Diente 10 -->
      <line x1="-35" y1="0" x2="-42" y2="0"/>
      <!-- Diente 11 -->
      <line x1="-30" y1="-18" x2="-36" y2="-23"/>
      <!-- Diente 12 -->
      <line x1="-18" y1="-30" x2="-23" y2="-36"/>
    </g>
    
    <!-- Círculo del engrane (perímetro) -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  </g>
</svg>