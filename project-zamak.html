            <h4>Objetivo y contexto</h4>
            <p>Diseñamos una potencia de bicicleta fundida en Zamak 3 y verificamos su capacidad mecánica. Primero definimos la geometría mediante un estudio ergonómico y después diseñamos el sistema de colada.</p>

            <h4>Análisis ergonómico</h4>
            <p>El trabajo se basó en la medición de ángulos corporales con RULER y en la definición de una geometría compatible con la postura del ciclista.</p>
